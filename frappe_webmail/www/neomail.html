<!doctype html>
<html lang="{{ lang }}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>NeoMail</title>
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #f3f4f6; }
		@media (prefers-color-scheme: dark) { html, body { background: #17181c; } }
		iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
		#signin { position: fixed; top: 0; left: 0; right: 0; z-index: 2; padding: 8px 16px; font: 14px system-ui, sans-serif;
			background: #fdf3d8; color: #4a3a12; border-bottom: 1px solid #e8d7a4; }
		#signin a { color: inherit; font-weight: 600; margin-left: 8px; }
		@media (prefers-color-scheme: dark) { #signin { background: #3a3220; color: #f4e8c8; border-color: #5a4a2a; } }
		#none { max-width: 36rem; margin: 18vh auto 0; padding: 0 24px; font: 15px/1.5 system-ui, sans-serif; color: #2a2d33; }
		#none h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; }
		#none a { color: #1d7f8c; font-weight: 600; }
		@media (prefers-color-scheme: dark) { #none { color: #e6e7ea; } #none a { color: #5cc3d0; } }
	</style>
</head>
<body>
	<script>
		window.frappe = window.frappe || {};
		{% include "frappe_webmail/public/js/neomail_host.js" %}
		// The person's mailboxes, language and the product's name for the framed build, which reads them from this page
		// (same origin), with the renewal of their tokens and the fetching of pictures (neomail_host.js, shared with the
		// desk's page /app/neomail). A renewal refused for an ended session shows the banner below.
		window.neomailHost.install(window, {{ host_json | safe }}, {
			sessionEnded: {{ _("Your Neoffice session has ended.") | tojson }},
			onSession: (alive) => {
				const banner = document.getElementById("signin");
				if (banner) banner.hidden = alive;
			},
		});
	</script>
	<!-- csrf_token -->
	{% if no_mailbox %}
	<main id="none">
		<h1>NeoMail</h1>
		<p>{{ _("You have no mailbox in Neoffice yet.") }}</p>
		<p><a href="/app/webmail">{{ _("Open the webmail to add one") }}</a></p>
	</main>
	{% else %}
	<div id="signin" role="alert" hidden>
		{{ _("Your Neoffice session has ended.") }}
		<a id="signin-link" href="/login?redirect-to=/neomail">{{ _("Sign in again") }}</a>
	</div>
	<script>
		// Back to this very page after signing in, with what its address carries.
		document.getElementById("signin-link").href =
			"/login?redirect-to=" + encodeURIComponent(location.pathname + location.search);
	</script>
	<iframe src="{{ build_url }}" title="NeoMail"></iframe>
	{% endif %}
</body>
</html>
