<!doctype html>
<html lang="{{ lang }}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>NeoMail</title>
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #f3f4f6; }
		@media (prefers-color-scheme: dark) { html, body { background: #17181c; } }
		iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
		#signin { position: fixed; top: 0; left: 0; right: 0; z-index: 2; padding: 8px 16px; font: 14px system-ui, sans-serif;
			background: #fdf3d8; color: #4a3a12; border-bottom: 1px solid #e8d7a4; }
		#signin a { color: inherit; font-weight: 600; margin-left: 8px; }
		@media (prefers-color-scheme: dark) { #signin { background: #3a3220; color: #f4e8c8; border-color: #5a4a2a; } }
		#none { max-width: 36rem; margin: 18vh auto 0; padding: 0 24px; font: 15px/1.5 system-ui, sans-serif; color: #2a2d33; }
		#none h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; }
		#none a { color: #1d7f8c; font-weight: 600; }
		@media (prefers-color-scheme: dark) { #none { color: #e6e7ea; } #none a { color: #5cc3d0; } }
	</style>
</head>
<body>
	<script>
		window.frappe = window.frappe || {};
		// The person's mailboxes, language and the product's name for the framed build, which reads them from this page (same origin).
		window.mailcraftJmap = {{ host_json | safe }};
		// New facade tokens for this page's session, when the build's were refused (MailCraft calls it, then retries).
		window.mailcraftJmapRenew = async function () {
			const answer = await fetch("/api/method/frappe_webmail.mailcraft_jmap.renew", {
				method: "POST",
				credentials: "same-origin",
				headers: { Accept: "application/json", "X-Frappe-CSRF-Token": window.frappe.csrf_token || "" },
			});
			// The desk session ended: the page says so, and offers to sign in again and come back here.
			if (answer.status === 401 || answer.status === 403) document.getElementById("signin").hidden = false;
			if (!answer.ok) return null;
			document.getElementById("signin").hidden = true;
			return (await answer.json()).message || null;
		};
		// The pictures on the web a message links to, once the person asked MailCraft to show them: a page can't read
		// another site's bytes, so the server fetches them (mailcraft_jmap.picture, under MailCraft's own rules), with
		// the facade's token and never this page's cookie. Two at a time; the server fetches only a few at once for the
		// whole instance and answers 503 to one more, asked again a moment later. A promise of { status, contentType,
		// bytes }, or a failure whose message MailCraft shows where the picture would have been.
		(function () {
			const first = ((window.mailcraftJmap && window.mailcraftJmap.accounts) || []).find((a) => a.secret);
			if (!first) return;
			let token = first.secret;
			const renew = window.mailcraftJmapRenew;
			// The framed build renews its tokens through the page: the pictures take the new one too.
			window.mailcraftJmapRenew = async function () {
				const answer = await renew();
				const fresh = ((answer && answer.accounts) || []).find((a) => a.secret);
				if (fresh) token = fresh.secret;
				return answer;
			};
			const AT_ONCE = 2;
			const PATIENCE_MS = 50000;
			let flying = 0;
			const waiting = [];
			const turn = () => new Promise((go) => (flying < AT_ONCE ? (flying++, go()) : waiting.push(go)));
			const done = () => {
				const next = waiting.shift();
				if (next) next();
				else flying--;
			};
			const pause = (ms) => new Promise((go) => setTimeout(go, ms));
			const ask = (url) =>
				fetch("/api/method/frappe_webmail.mailcraft_jmap.picture", {
					method: "POST",
					credentials: "omit",
					cache: "no-store",
					referrerPolicy: "no-referrer",
					headers: { Authorization: "Bearer " + token, "Content-Type": "application/json", Accept: "image/*, application/json" },
					body: JSON.stringify({ url: String(url) }),
				});
			window.mailcraftFetchUrl = async function (url) {
				const since = Date.now();
				await turn();
				try {
					let renewed = false;
					for (;;) {
						const answer = await ask(url);
						if (answer.ok) {
							const bytes = new Uint8Array(await answer.arrayBuffer());
							return { status: answer.status, contentType: answer.headers.get("Content-Type") || "", bytes };
						}
						// The token was refused (it expired with the cache, or after twelve hours): a new one, once.
						if ((answer.status === 401 || answer.status === 403) && !renewed) {
							renewed = true;
							await window.mailcraftJmapRenew();
							continue;
						}
						if (answer.status === 503 && Date.now() - since < PATIENCE_MS) {
							await pause(400 + Math.random() * 600);
							continue;
						}
						let detail = "";
						try {
							detail = (await answer.json()).detail || "";
						} catch (e) {}
						throw new Error(detail || "HTTP " + answer.status);
					}
				} finally {
					done();
				}
			};
		})();
	</script>
	<!-- csrf_token -->
	{% if no_mailbox %}
	<main id="none">
		<h1>NeoMail</h1>
		<p>{{ _("You have no mailbox in Neoffice yet.") }}</p>
		<p><a href="/app/webmail">{{ _("Open the webmail to add one") }}</a></p>
	</main>
	{% else %}
	<div id="signin" role="alert" hidden>
		{{ _("Your Neoffice session has ended.") }}
		<a href="/login?redirect-to=/neomail">{{ _("Sign in again") }}</a>
	</div>
	<iframe src="{{ build_url }}" title="NeoMail"></iframe>
	{% endif %}
</body>
</html>
