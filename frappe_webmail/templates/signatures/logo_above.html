{#- Logo above: the logo on a row of its own, the details under it. -#}
{% from "_blocks.html" import details, disclaimer, logo %}
<table cellpadding="0" cellspacing="0" border="0" style="{{ look.table }}">
{% if card.logo %}
<tr><td valign="top" style="{{ look.cell }}padding:0 0 {{ "10px" if card.has_details else "0" }} 0;">{{ logo(card.logo) }}</td></tr>
{% endif %}
{% if card.has_details %}
<tr><td valign="top" style="{{ look.cell }}padding:0;">{{ details(card, look) }}</td></tr>
{% endif %}
{{ disclaimer(card, look) }}
</table>
