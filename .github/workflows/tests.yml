# Fleet app tests: every direct push to version-15, every PR, and nightly.
# Mechanics live in bvisible/neoffice-ci (public: reusable workflows must be public for public callers):
# bench init on OUR frappe fork, deps, blocking build, run-tests, report to the
# hub which opens/closes the repo's [CI] issue in bvisible/neoffice-maintenance.
name: Tests
on:
  push:
    branches: [version-15]
  pull_request:
  workflow_dispatch:
    inputs:
      test_args:
        description: "Extra args for bench run-tests (e.g. --debug-records)"
        required: false
        default: ""
  schedule:
    - cron: "50 3 * * *"
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: bvisible/neoffice-ci/.github/workflows/frappe-app-ci.yml@main
    with:
      app: frappe_webmail
      install_apps: ""
      test_args: ${{ inputs.test_args || '' }}
    # inherit: CI_REPORT_SECRET + FLEET_READ_TOKEN (private bvisible deps)
    secrets: inherit
  # The Vue frontend has its own suite (vitest, happy-dom). It does not need a bench;
  # it ran nowhere before 2026-09-07, so the specs had drifted red for months (#276).
  frontend-tests:
    name: frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn --cwd frontend install --frozen-lockfile
      - run: yarn --cwd frontend test:run
